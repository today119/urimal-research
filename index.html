<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리말 조사 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff7ee; --bg2:#eef7ff; --bg3:#f5fff0;
  --ink:#3b3550; --sub:#8a83a0; --line:#e6e0f0;
  --grape:#8b6fd6; --grape-d:#6f55b8;
  --blue:#4c9be8; --blue-d:#2f7cc8;
  --pink:#ff8fb1; --orange:#ffab5e; --orange-d:#ef8c35; --green:#5ec98d; --green-d:#3aa96c;
  --shadow:0 4px 0 rgba(0,0,0,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; font-family:'Jua',system-ui,'Apple SD Gothic Neo',sans-serif; color:var(--ink);
  background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3)); background-attachment:fixed;
  min-height:100vh;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:'Gowun Dodum','Jua',sans-serif; font-size:18px; color:var(--ink)}
.btn{border-radius:14px; padding:.55em 1em; font-size:17px; background:#fff; border:2px solid var(--line);
  box-shadow:var(--shadow); transition:transform .08s,box-shadow .08s; white-space:nowrap}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.1)}
.btn.primary{background:var(--grape); color:#fff; border-color:var(--grape-d)}
.btn.blue{background:var(--blue); color:#fff; border-color:var(--blue-d)}
.btn.orange{background:var(--orange); color:#fff; border-color:var(--orange-d)}
.btn.green{background:var(--green); color:#fff; border-color:var(--green-d)}
.btn.small{font-size:14px; padding:.35em .7em; border-radius:10px; box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.danger{color:#d9534f}

header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line); padding:10px 16px 0}
.hrow{display:flex; align-items:center; gap:10px; max-width:980px; margin:0 auto}
.hrow h1{margin:0; font-size:24px; flex:1; font-weight:normal}
.hrow h1 small{font-size:15px; color:var(--sub); margin-left:6px}
.steps{display:flex; gap:6px; max-width:980px; margin:10px auto 0; overflow-x:auto}
.step{flex:1; min-width:120px; padding:10px 8px 9px; font-size:18px; border-radius:14px 14px 0 0;
  background:#f3f0fa; color:var(--sub); border:2px solid var(--line); border-bottom:none; position:relative}
.step.on{background:#fff; color:var(--ink); box-shadow:0 -3px 0 var(--grape) inset}
.step.off{opacity:.45}
.step .n{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%;
  background:var(--grape); color:#fff; font-size:14px; margin-right:4px}
.step .ok{position:absolute; right:6px; top:4px; font-size:13px}

main{max-width:980px; margin:0 auto; padding:18px 16px 120px}
.card{background:#fff; border:2px solid var(--line); border-radius:20px; padding:18px 18px; margin-bottom:16px; box-shadow:var(--shadow)}
.card h2{margin:0 0 10px; font-size:22px; font-weight:normal}
.card h3{margin:0 0 8px; font-size:19px; font-weight:normal}
.hint{color:var(--sub); font-size:15px; margin:4px 0 10px; line-height:1.5}
label.f{display:block; font-size:17px; margin:12px 0 6px}
input.t,textarea{width:100%; border:2px solid var(--line); border-radius:12px; padding:10px 12px; background:#fcfbff; outline:none; line-height:1.55}
input.t:focus,textarea:focus{border-color:var(--grape); background:#fff}
textarea{min-height:84px; resize:vertical}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px}
.chip{font-size:15px; padding:6px 11px; border-radius:999px; background:#f3f0fa; border:1.5px solid var(--line)}
.chip:hover{background:#ebe4ff}
.tip{background:#fff8e6; border:2px dashed #f3d48a; border-radius:16px; padding:12px 14px; font-size:16px; line-height:1.6}

/* 방법 고르기 */
.methods{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.method{border:3px solid var(--line); border-radius:18px; padding:16px; text-align:left; background:#fff; font-size:20px}
.method .big{font-size:42px; display:block}
.method p{font-family:'Gowun Dodum'; font-size:15px; color:var(--sub); margin:6px 0 0; line-height:1.5}
.method.on{border-color:var(--grape); background:#f6f1ff; box-shadow:0 4px 0 var(--grape-d)}
.method.on::after{content:'✔ 골랐어요'; display:inline-block; margin-top:8px; font-size:15px; color:var(--grape-d)}

/* 설문 하위 탭 */
.sub{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.sub button{font-size:18px; padding:9px 16px; border-radius:999px; background:#fff; border:2px solid var(--line)}
.sub button.on{background:var(--blue); color:#fff; border-color:var(--blue-d)}
.qhead{display:flex; gap:8px; align-items:center}
.qnum{flex:0 0 auto; background:var(--blue); color:#fff; border-radius:10px; padding:4px 10px; font-size:17px}
.opt{display:flex; gap:6px; align-items:center; margin:6px 0}
.opt .dot{flex:0 0 auto; width:28px; text-align:center; color:var(--blue-d); font-size:18px}

/* 세기 */
.qtitle{font-size:21px; margin-bottom:10px}
.counter{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px}
.cbtn{position:relative; border-radius:18px; padding:14px 12px 12px; background:#eef6ff; border:3px solid #cfe3fa;
  box-shadow:0 5px 0 #b9d4f2; text-align:center; font-size:19px; min-height:110px; user-select:none}
.cbtn:active{transform:translateY(4px); box-shadow:0 1px 0 #b9d4f2}
.cbtn .cnt{display:block; font-size:42px; color:var(--blue-d); line-height:1.1; margin-top:4px}
.cbtn .cnt small{font-size:18px}
.cbtn .minus{position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%; background:#fff;
  border:2px solid #cfe3fa; font-size:18px; line-height:24px; color:var(--sub)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
.total{margin-top:10px; font-size:17px; color:var(--sub)}
.tally{font-family:'Gowun Dodum'; letter-spacing:2px; color:#9bb7d6; font-size:14px; display:block; min-height:16px; margin-top:2px}

/* 그래프 */
.bars{margin:8px 0 6px}
.bar{display:grid; grid-template-columns:minmax(80px,30%) 1fr 92px; gap:10px; align-items:center; margin:7px 0; font-size:17px}
.bar .lab{text-align:right; overflow-wrap:anywhere}
.bar .trk{height:30px; background:#f1eef8; border-radius:9px; overflow:hidden}
.bar .fill{height:100%; border-radius:9px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.bar .val{font-size:16px}
.auto{background:#f2f8ff; border-radius:12px; padding:10px 12px; font-family:'Gowun Dodum'; font-size:16px; line-height:1.6}
.auto b{font-family:'Jua'; font-weight:normal}

/* 면담 */
.iv{border-left:6px solid var(--orange)}
.qa{border:2px solid #ffe3c6; background:#fffaf4; border-radius:14px; padding:10px 12px; margin:8px 0}
.qa .q{display:flex; gap:6px; align-items:center}
.qa .q span{flex:0 0 auto; color:var(--orange-d)}

/* 보고서 */
.paper{background:#fff; border-radius:6px; padding:34px 38px; box-shadow:0 6px 24px rgba(60,40,120,.12); border:1px solid #eee;
  font-family:'Gowun Dodum',sans-serif; font-size:16px; line-height:1.75}
.paper h1{font-family:'Jua'; font-weight:normal; font-size:27px; text-align:center; margin:0 0 4px}
.paper .who{text-align:center; color:#666; margin-bottom:20px}
.paper h2{break-after:avoid; font-family:'Jua'; font-weight:normal; font-size:20px; margin:20px 0 6px; padding-bottom:4px; border-bottom:2px solid #ece6f8}
.paper h3{break-after:avoid; font-family:'Jua'; font-weight:normal; font-size:17px; margin:12px 0 4px}
.paper p{margin:4px 0; white-space:pre-wrap}
.paper .empty{color:#c0b9d0}
.paper .bar{font-size:15px; grid-template-columns:minmax(70px,28%) 1fr 84px; margin:4px 0}
.paper .bar .trk{height:22px}
.paper .qa{background:#fff; border-color:#f1e4d4; padding:6px 10px; margin:6px 0; break-inside:avoid}
.paper .blk{break-inside:avoid}

.empty-box{text-align:center; padding:26px 10px; color:var(--sub); font-size:18px}
.empty-box .big{font-size:50px; display:block}
.nav{display:flex; justify-content:space-between; margin-top:10px}

.sheet-bg{position:fixed; inset:0; background:rgba(40,30,70,.35); z-index:50; display:grid; place-items:center; padding:16px}
.sheet{background:#fff; border-radius:22px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:22px}
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#3b3550; color:#fff; padding:10px 18px;
  border-radius:999px; font-size:17px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none}
.toast.on{opacity:1}

@media (max-width:640px){
  .methods{grid-template-columns:1fr}
  .paper{padding:22px 16px}
  .bar{grid-template-columns:minmax(64px,30%) 1fr 76px}
}
@media print{
  body{background:#fff}
  header,.noprint,.toast{display:none!important}
  main{padding:0; max-width:none}
  .paper{box-shadow:none; border:none; padding:0}
  @page{size:A4; margin:16mm 15mm}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>📝 우리말 조사 도우미<small id="hname"></small></h1>
    <button class="btn small" id="btnSet">⚙️ 저장·불러오기</button>
  </div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const KEY='urimal_research_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const COLORS=['#4c9be8','#ff8fb1','#5ec98d','#ffab5e','#8b6fd6','#3cc2c9','#f2c14e','#e87070'];

function blank(){
  return {name:'', topic:'', why:'', guess:'', m:{survey:false, interview:false},
    survey:{who:'', when:'', qs:[], mode:'make'},
    ivs:[], learned:'', felt:'', todo:'', step:0, last:null};
}
let S=load();
function load(){
  try{ const r=localStorage.getItem(KEY); if(r) return Object.assign(blank(), JSON.parse(r)); }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1800); }

/* data-p="survey.qs.0.q" 같은 경로로 값 읽고 쓰기 */
function getP(p){ return p.split('.').reduce((o,k)=>o?.[k], S); }
function setP(p,v){ const ks=p.split('.'); const last=ks.pop(); const o=ks.reduce((o,k)=>o[k], S); o[last]=v; }

const STEPS=[
  {ic:'🔎', t:'주제 정하기'},
  {ic:'📊', t:'설문조사', need:'survey'},
  {ic:'🎤', t:'면담', need:'interview'},
  {ic:'📄', t:'보고서'},
];
function stepDone(i){
  if(i===0) return S.topic.trim() && (S.m.survey||S.m.interview);
  if(i===1) return S.survey.qs.some(q=>sum(q)>0);
  if(i===2) return S.ivs.some(v=>v.qs.some(x=>x.a.trim()));
  if(i===3) return S.learned.trim() && S.felt.trim();
}
function drawSteps(){
  $('#steps').innerHTML=STEPS.map((s,i)=>{
    const off=s.need && !S.m[s.need];
    return `<button class="step ${S.step===i?'on':''} ${off?'off':''}" data-go="${i}"><span class="n">${i+1}</span>${s.ic} ${s.t}${stepDone(i)?'<span class="ok">✅</span>':''}</button>`;
  }).join('');
  $('#hname').textContent=S.name?`· ${S.name}`:'';
}
function go(i){ S.step=i; save(); render(); window.scrollTo({top:0}); }

function render(){
  drawSteps();
  $('#main').innerHTML=[viewTopic,viewSurvey,viewInterview,viewReport][S.step]();
  if(S.step===3) drawPaper();
}

/* ───────── 1. 주제 정하기 ───────── */
const TOPIC_EX=[
  '우리 반 친구들은 줄임말을 얼마나 쓸까?',
  '우리 동네 간판에는 외국어가 얼마나 있을까?',
  '친구들은 언제 바르지 않은 말(비속어)을 쓸까?',
  '어른들은 요즘 어린이들의 말을 어떻게 생각할까?',
  '우리가 자주 쓰는 신조어는 무엇일까?',
  '친구들은 웃어른께 높임말을 잘 쓸까?',
];
function viewTopic(){
  return `
  <div class="card">
    <h2>👋 내 이름</h2>
    <input class="t" data-p="name" value="${esc(S.name)}" placeholder="예) 4학년 2반 7번 김하늘">
  </div>
  <div class="card">
    <h2>🔎 무엇을 조사할까요?</h2>
    <p class="hint">궁금한 것을 <b>질문 모양</b>으로 써 보세요. 아래 예시를 눌러서 고쳐 써도 좋아요.</p>
    <input class="t" data-p="topic" value="${esc(S.topic)}" placeholder="예) 우리 반 친구들은 줄임말을 얼마나 쓸까?">
    <div class="chips">${TOPIC_EX.map(t=>`<button class="chip" data-topic="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <label class="f">💭 이 주제를 고른 까닭은?</label>
    <textarea data-p="why" placeholder="예) 친구들과 이야기할 때 줄임말을 많이 쓰는데, 다른 친구들은 얼마나 쓰는지 궁금했다.">${esc(S.why)}</textarea>
    <label class="f">🤔 조사하기 전 내 생각 (예상)</label>
    <textarea data-p="guess" placeholder="예) 우리 반 친구들 절반 이상이 줄임말을 자주 쓸 것 같다.">${esc(S.guess)}</textarea>
  </div>
  <div class="card">
    <h2>🧭 어떤 방법으로 조사할까요? <small class="hint">(둘 다 골라도 돼요)</small></h2>
    <div class="methods">
      <button class="method ${S.m.survey?'on':''}" data-m="survey"><span class="big">📊</span>설문조사
        <p>여러 사람에게 같은 질문을 하고, 답을 세어서 그래프로 정리해요.</p></button>
      <button class="method ${S.m.interview?'on':''}" data-m="interview"><span class="big">🎤</span>면담
        <p>한두 사람을 직접 만나 질문하고, 들은 이야기를 자세히 적어요.</p></button>
    </div>
  </div>
  <div class="nav noprint"><span></span>
    ${S.m.survey||S.m.interview?`<button class="btn primary" data-go="${S.m.survey?1:2}">다음으로 ▶</button>`:''}
  </div>`;
}

/* ───────── 2. 설문조사 ───────── */
const sum=q=>q.opts.reduce((a,o)=>a+(+o.c||0),0);
const Q_EX=[
  {q:'줄임말을 얼마나 자주 쓰나요?', opts:['거의 안 쓴다','가끔 쓴다','자주 쓴다','아주 많이 쓴다']},
  {q:'줄임말을 쓰는 까닭은 무엇인가요?', opts:['편하고 빨라서','친구들이 써서','재미있어서','잘 모르겠다']},
  {q:'바르지 않은 말을 들으면 기분이 어떤가요?', opts:['기분이 나쁘다','별 느낌 없다','나도 따라 하게 된다']},
  {q:'우리말을 바르게 써야 한다고 생각하나요?', opts:['그렇다','보통이다','아니다']},
];
function newQ(ex){ return {id:uid(), q:ex?ex.q:'', opts:(ex?ex.opts:['','']).map(t=>({t,c:0})), memo:'', note:''}; }

function needMethod(k){
  const n=k==='survey'?'설문조사':'면담';
  return `<div class="card empty-box"><span class="big">${k==='survey'?'📊':'🎤'}</span>
    ${n}는 아직 고르지 않았어요.<br><br>
    <button class="btn primary" data-pick="${k}">${n}도 할래요</button>
    <button class="btn" data-go="0">주제 정하기로</button></div>`;
}
function viewSurvey(){
  if(!S.m.survey) return needMethod('survey');
  const sv=S.survey, mode=sv.mode;
  const tabs=`<div class="sub noprint">
    <button class="${mode==='make'?'on':''}" data-mode="make">✏️ ① 질문 만들기</button>
    <button class="${mode==='count'?'on':''}" data-mode="count">🖐️ ② 답 세기</button>
    <button class="${mode==='result'?'on':''}" data-mode="result">📈 ③ 결과 보기</button></div>`;
  let body='';
  if(mode==='make'){
    body=`<div class="card">
      <h2>👥 누구에게 물어볼까요?</h2>
      <div class="row" style="gap:12px">
        <div style="flex:2;min-width:220px"><label class="f" style="margin-top:0">조사 대상</label>
          <input class="t" data-p="survey.who" value="${esc(sv.who)}" placeholder="예) 우리 반 친구들"></div>
        <div style="flex:1;min-width:160px"><label class="f" style="margin-top:0">조사한 날</label>
          <input class="t" data-p="survey.when" value="${esc(sv.when)}" placeholder="예) 10월 8일"></div>
      </div>
    </div>`+
    sv.qs.map((q,i)=>`<div class="card">
      <div class="qhead"><span class="qnum">질문 ${i+1}</span>
        <input class="t" data-p="survey.qs.${i}.q" value="${esc(q.q)}" placeholder="물어볼 질문을 써요">
        <button class="btn small danger" data-delq="${i}" title="질문 지우기">🗑️</button></div>
      <p class="hint" style="margin:8px 0 2px">보기(고를 수 있는 답)</p>
      ${q.opts.map((o,j)=>`<div class="opt"><span class="dot">${'①②③④⑤⑥⑦⑧'[j]||'•'}</span>
        <input class="t" data-p="survey.qs.${i}.opts.${j}.t" value="${esc(o.t)}" placeholder="보기 ${j+1}">
        ${q.opts.length>2?`<button class="btn small" data-delo="${i}.${j}">✕</button>`:''}</div>`).join('')}
      ${q.opts.length<8?`<button class="btn small" data-addo="${i}">＋ 보기 더하기</button>`:''}
    </div>`).join('')+
    `<div class="card">
      <div class="row"><button class="btn blue" data-addq>＋ 새 질문 만들기</button></div>
      <p class="hint" style="margin-top:14px">💡 예시 질문을 눌러서 가져온 뒤 내 주제에 맞게 고쳐 써도 돼요.</p>
      <div class="chips">${Q_EX.map((e,k)=>`<button class="chip" data-exq="${k}">${esc(e.q)}</button>`).join('')}</div>
      <div class="tip" style="margin-top:12px">✍️ <b>좋은 설문 질문 만들기</b><br>
        · 한 질문에는 <b>한 가지만</b> 물어봐요.<br>
        · 보기는 <b>겹치지 않게</b> 만들어요. (예: "가끔"과 "때때로"는 비슷해서 헷갈려요)<br>
        · 답하기 싫은 질문, 친구 이름이 나오는 질문은 피해요.</div>
    </div>`;
    if(sv.qs.length) body+=`<div class="nav"><span></span><button class="btn primary" data-mode="count">질문 다 만들었어요 → 답 세기 ▶</button></div>`;
  }
  else if(mode==='count'){
    if(!sv.qs.length) body=`<div class="card empty-box"><span class="big">✏️</span>먼저 질문을 만들어 주세요.<br><br><button class="btn blue" data-mode="make">질문 만들러 가기</button></div>`;
    else body=`<div class="tip noprint" style="margin-bottom:14px">🖐️ 친구가 고른 보기를 <b>한 번씩 눌러요</b>. 잘못 눌렀으면 오른쪽 위 <b>−</b> 를 눌러요.</div>`+
      sv.qs.map((q,i)=>`<div class="card">

        <div class="counter">${q.opts.map((o,j)=>`<div class="cbtn" role="button" data-inc="${i}.${j}">
          ${esc(o.t)||`보기 ${j+1}`}<span class="cnt" id="c${i}_${j}">${o.c}<small>명</small></span>

        <div class="total">지금까지 <b id="t${i}">${sum(q)}</b>명이 답했어요.</div>
        <label class="f">🗨️ 친구들이 덧붙인 말 (있으면 메모)</label>
        <textarea data-p="survey.qs.${i}.memo" style="min-height:60px" placeholder="예) 'ㅇㅈ'은 줄임말인 줄 몰랐다는 친구가 있었다.">${esc(q.memo)}</textarea>
      </div>`).join('')+
      `<div class="nav"><button class="btn" data-mode="make">◀ 질문 고치기</button><button class="btn primary" data-mode="result">다 셌어요 → 결과 보기 ▶</button></div>`;
  }
  else{
    if(!sv.qs.some(q=>sum(q)>0)) body=`<div class="card empty-box"><span class="big">🖐️</span>아직 센 답이 없어요.<br><br><button class="btn blue" data-mode="count">답 세러 가기</button></div>`;
    else body=sv.qs.map((q,i)=>`<div class="card">
        <div class="qtitle"><span class="qnum">질문 ${i+1}</span> ${esc(q.q)}</div>
        ${bars(q)}
        <div class="auto">${autoSentence(q)}</div>
        <label class="f">🔍 이 결과를 보고 알게 된 점</label>
        <textarea data-p="survey.qs.${i}.note" placeholder="예) 생각보다 줄임말을 자주 쓰는 친구가 많았다.">${esc(q.note)}</textarea>
      </div>`).join('')+
      `<div class="nav"><button class="btn" data-mode="count">◀ 더 세기</button><button class="btn primary" data-go="${S.m.interview?2:3}">${S.m.interview?'면담으로':'보고서 쓰기'} ▶</button></div>`;
  }
  return tabs+body;
}
function tally(n){ // 바를 정(正) 모양 대신 ✓ 묶음
  if(n>40) return '';
  let s=''; for(let k=1;k<=n;k++){ s+='|'; if(k%5===0) s+=' '; } return s;
}
function bars(q){
  const t=sum(q)||1;
  return `<div class="bars">${q.opts.map((o,j)=>{
    const p=Math.round(o.c/t*100);
    return `<div class="bar"><div class="lab">${esc(o.t)||`보기 ${j+1}`}</div>
      <div class="trk"><div class="fill" style="width:${o.c?Math.max(p,2):0}%;background:${COLORS[j%COLORS.length]}"></div></div>
      <div class="val">${o.c}명 (${p}%)</div></div>`;
  }).join('')}</div>`;
}
function autoSentence(q,da){
  const t=sum(q); if(!t) return da?'':'아직 답이 없어요.';
  const E=da?{a:'가장 많았다.',b:'이다.',c:'골랐다.'}:{a:'가장 많았어요.',b:'이에요.',c:'골랐어요.'};
  const sorted=q.opts.map((o,j)=>({...o,j})).sort((a,b)=>b.c-a.c);
  const top=sorted[0], ties=sorted.filter(o=>o.c===top.c);
  const nm=o=>`'${o.t||('보기 '+(o.j+1))}'`;
  let s=`<b>${t}명</b>에게 물어보았더니, `;
  if(ties.length>1) s+=`${ties.map(nm).join(', ')}가 <b>${top.c}명씩</b> 똑같이 ${E.a}`;
  else{
    s+=`${nm(top)}라고 답한 사람이 <b>${top.c}명(${Math.round(top.c/t*100)}%)</b>으로 ${E.a}`;
    const low=sorted[sorted.length-1];
    if(sorted.length>1 && low.c<top.c) s+=` 가장 적은 답은 ${nm(low)}(${low.c}명)${E.b}`;
  }
  if(top.c*2>t) s+=` 절반이 넘는 사람이 ${nm(top)}를 ${E.c}`;
  return s;
}
function plainSentence(q){ return autoSentence(q,true).replace(/<[^>]+>/g,''); }

function para(t,ph){ return t&&t.trim()?`<p>${esc(t.trim())}</p>`:`<p class="empty">(${ph})</p>`; }
function drawPaper(){
  const el=$('#paper'); if(!el) return;
  const sv=S.survey, ivs=S.ivs.filter(v=>v.who||v.qs.some(x=>x.q||x.a));
  const sq=sv.qs.filter(q=>q.q||sum(q));
  let n=0; const H=t=>`<h2>${++n}. ${t}</h2>`;
  let h=`<h1>${esc(S.topic)||'<span class="empty">(조사 주제)</span>'}</h1>
    <div class="who">${esc(S.name)||'&nbsp;'}</div>`;
  h+=H('조사하게 된 까닭')+para(S.why,'조사하게 된 까닭을 써요');
  if(S.guess.trim()) h+=`<h3>조사하기 전 나의 예상</h3>`+para(S.guess);
  h+=H('조사 방법');
  const ms=[];
  if(S.m.survey){
    const tot=Math.max(0,...sq.map(sum));
    ms.push(`<p>· <b>설문조사</b>: ${esc(sv.who)||'(대상)'}${tot?` ${tot}명`:''}에게 ${sq.length}가지 질문을 하였다.${sv.when?` (${esc(sv.when)})`:''}</p>`);
  }
  if(S.m.interview){
    ms.push(`<p>· <b>면담</b>: ${ivs.length?ivs.map(v=>esc(v.who||'(누구)')+(v.rel?`(${esc(v.rel)})`:'')).join(', ')+'을(를) 만나 이야기를 들었다.':'(누구를 만났는지)'}${ivs.some(v=>v.when)?` (${ivs.map(v=>esc(v.when)).filter(Boolean).join(', ')})`:''}</p>`);
  }
  h+=ms.join('');
  h+=H('조사 결과');
  if(S.m.survey){
    h+=`<h3>📊 설문조사 결과</h3>`;
    if(!sq.length) h+=`<p class="empty">(설문 결과가 아직 없어요)</p>`;
    sq.forEach((q,i)=>{
      h+=`<div class="blk"><p><b>질문 ${i+1}. ${esc(q.q)}</b></p>${bars(q)}<p>${esc(plainSentence(q))}</p>
        ${q.memo.trim()?`<p>· 친구들의 말: ${esc(q.memo.trim())}</p>`:''}
        ${q.note.trim()?`<p>→ ${esc(q.note.trim())}</p>`:''}</div>`;
    });

  if(S.m.interview){
    h+=`<h3>🎤 면담 결과</h3>`;
    if(!ivs.length) h+=`<p class="empty">(면담 내용이 아직 없어요)</p>`;
    ivs.forEach(v=>{
      h+=`<div class="blk"><p><b>${esc(v.who||'면담')}</b>${v.rel?` (${esc(v.rel)})`:''}</p>`+
        v.qs.filter(x=>x.q||x.a).map(x=>`<div class="qa"><b>Q.</b> ${esc(x.q)}<br><b>A.</b> ${esc(x.a)||'<span class="empty">(답)</span>'}</div>`).join('')+
        (v.best.trim()?`<p>⭐ 기억에 남는 말: ${esc(v.best.trim())}</p>`:'')+`</div>`;

  h+=H('느낀 점')+para(S.felt,'느낀 점과 앞으로의 다짐을 써요');

}

/* ───────── 이벤트 ───────── */
document.addEventListener('input',e=>{
  const p=e.target.dataset?.p; if(!p) return;
  setP(p,e.target.value); save();
  if(S.step===3) drawPaper();
  if(p==='name') $('#hname').textContent=S.name?`· ${S.name}`:'';

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-inc]'); if(!b) return;
  const d=b.dataset;
  if(d.go!==undefined){ go(+d.go); return; }
  if(d.topic){ S.topic=d.topic; save(); render(); return; }
  if(d.m){ S.m[d.m]=!S.m[d.m]; save(); render(); return; }
  if(d.pick){ S.m[d.pick]=true; save(); render(); return; }
  if(d.mode){ S.survey.mode=d.mode; save(); render(); window.scrollTo({top:0}); return; }
  if(d.addq!==undefined){ S.survey.qs.push(newQ()); save(); render(); focusLast('[data-p$=".q"]'); return; }
  if(d.exq!==undefined){ S.survey.qs.push(newQ(Q_EX[+d.exq])); save(); render(); toast('예시 질문을 넣었어요. 내 주제에 맞게 고쳐 보세요!'); return; }
  if(d.delq!==undefined){ const q=S.survey.qs[+d.delq];
    if(sum(q)>0 && !confirm(`이 질문에 센 답(${sum(q)}명)도 같이 지워져요. 지울까요?`)) return;
    S.survey.qs.splice(+d.delq,1); save(); render(); return; }
  if(d.addo!==undefined){ S.survey.qs[+d.addo].opts.push({t:'',c:0}); save(); render(); return; }
  if(d.delo){ const [i,j]=d.delo.split('.').map(Number); S.survey.qs[i].opts.splice(j,1); save(); render(); return; }
  if(d.dec){ e.stopPropagation(); bump(d.dec,-1); return; }
  if(d.inc){ bump(d.inc,1); return; }
  if(d.addiv!==undefined){ S.ivs.push(newIv()); save(); render(); return; }
  if(d.deliv!==undefined){ if(!confirm('이 면담 내용을 지울까요?')) return; S.ivs.splice(+d.deliv,1); save(); render(); return; }
  if(d.addivq!==undefined){ S.ivs[+d.addivq].qs.push({q:'',a:''}); save(); render(); return; }
  if(d.delivq){ const [i,j]=d.delivq.split('.').map(Number); const x=S.ivs[i].qs[j];
    if(x.a.trim() && !confirm('적어 둔 답도 같이 지워져요. 지울까요?')) return;
    S.ivs[i].qs.splice(j,1); save(); render(); return; }
  if(d.exivq){ const [i,k]=d.exivq.split('.').map(Number); const v=S.ivs[i];
    const empty=v.qs.find(x=>!x.q.trim()); if(empty) empty.q=IVQ_EX[k]; else v.qs.push({q:IVQ_EX[k],a:''});
    save(); render(); return; }
  if(d.st){ const ta=$('#ta_'+d.st); const cur=S[d.st];
    S[d.st]=cur+(cur&&!/\s$/.test(cur)?' ':'')+d.t; ta.value=S[d.st]; save(); drawPaper();
    ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); return; }
  if(b.id==='btnPrint'){ window.print(); return; }
  if(b.id==='btnSet'){ openSettings(); return; }
});
function focusLast(sel){ const all=document.querySelectorAll(sel); const el=all[all.length-1]; if(el){ el.focus(); el.scrollIntoView({block:'center'}); } }
function bump(key,dlt){
  const [i,j]=key.split('.').map(Number); const o=S.survey.qs[i].opts[j];
  o.c=Math.max(0,(+o.c||0)+dlt); save();
  const c=$(`#c${i}_${j}`); c.innerHTML=`${o.c}<small>명</small>`; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  c.nextElementSibling.textContent=tally(o.c);
  $(`#t${i}`).textContent=sum(S.survey.qs[i]);
  drawSteps();
}

  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  bg.querySelector('#cl').onclick=close;

    const blob=new Blob([JSON.stringify({app:'urimal',v:1,data:S},null,1)],{type:'application/json'});

    a.download=`우리말조사_${(S.name||'내조사').replace(/[\\/:*?"<>|]/g,'')}.json`; a.click();

  bg.querySelector('#fi').onchange=async ev=>{
    const f=ev.target.files[0]; if(!f) return;
    try{ const j=JSON.parse(await f.text()); if(j.app!=='urimal') throw 0;
      if(!confirm('지금 쓰고 있는 내용 대신 이 파일의 내용으로 바꿀까요?')) return;
      S=Object.assign(blank(),j.data); save(); close(); render(); toast('불러왔어요 📂');
    }catch(e){ alert('우리말 조사 도우미에서 저장한 파일이 아니에요.'); }
  };
  bg.querySelector('#rs').onclick=()=>{
    if(!confirm('지금까지 쓴 내용이 모두 지워져요. 정말 처음부터 할까요?')) return;
    S=blank(); save(); close(); render();
  };
}

render();
</script>
</body>
</html>
